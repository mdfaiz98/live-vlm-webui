Traffic monitoring cascade demo - detection (YOLO26, Hexagon NPU) feeding a
bounding-box overlay + tracked-objects panel. Deliberately a separate page
from index.html; see CLAUDE.md and VLM_Cascade_Architecture_Plan.md.

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advantech Traffic Monitoring Demo</title>

    <link rel="icon" type="image/svg+xml" href="favicon/favicon.svg">
    <link rel="icon" type="image/x-icon" href="favicon/favicon.ico">
    <link rel="icon" type="image/png" sizes="96x96" href="favicon/favicon-96x96.png">
    <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">

    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/traffic.css">
</head>
<body>
    <div class="header">
        <div class="header-left">
            <div class="logo" style="display: flex; align-items: center;">
                <img src="/images/advantech-logo.png" alt="Advantech" style="height: 70px; width: auto; display: block; margin: -13px 0;">
            </div>
            <div class="title-section">
                <h1>Traffic Monitoring</h1>
                <div class="subtitle">Detection &rarr; VLM Cascade Demo</div>
            </div>
        </div>
        <div class="header-right">
            <span class="status-badge disconnected" id="connectionStatus">Disconnected</span>
            <button class="traffic-toggle-btn" id="toggleBtn">Stop</button>
        </div>
    </div>

    <div class="traffic-layout">
        <div class="video-panel">
            <div class="video-wrap" id="videoWrap">
                <video id="trafficVideo" autoplay muted playsinline></video>
                <div class="fps-counter" id="fpsCounter">-- FPS</div>
                <button class="play-pause-btn" id="playPauseBtn" aria-label="Pause" title="Pause">&#10074;&#10074;</button>
                <div class="loading-overlay" id="loadingOverlay">Connecting...</div>
            </div>
            <div class="video-caption">
                Vehicles detected on-device (YOLO26n, Hexagon NPU)
            </div>
        </div>

        <div class="tracked-panel">
            <div class="tracked-panel-header">
                <span>Detected Vehicles</span>
                <div class="tracked-panel-header-right">
                    <span class="tracked-count" id="trackedCount">0</span>
                    <button class="edit-prompt-btn" id="editPromptBtn" title="Edit the description prompt">&#9998; Prompt</button>
                </div>
            </div>
            <div class="prompt-edit-area hidden" id="promptEditArea">
                <textarea id="promptEditTextarea" rows="4"></textarea>
                <div class="prompt-edit-actions">
                    <button class="prompt-action-btn primary" id="promptSaveBtn">Save</button>
                    <button class="prompt-action-btn" id="promptResetBtn">Reset to default</button>
                    <button class="prompt-action-btn" id="promptCancelBtn">Cancel</button>
                </div>
            </div>
            <div class="tracked-list" id="trackedList">
                <div class="tracked-empty">Waiting for detections...</div>
            </div>
        </div>
    </div>

    <div class="detail-modal-backdrop hidden" id="detailModalBackdrop">
        <div class="detail-modal">
            <button class="detail-modal-close" id="detailModalClose" aria-label="Close">&times;</button>
            <img class="detail-modal-img" id="detailModalImg" alt="">
            <div class="detail-modal-label" id="detailModalLabel"></div>
            <div class="detail-modal-score" id="detailModalScore"></div>
            <div class="detail-modal-caption-area" id="detailModalCaptionArea"></div>
        </div>
    </div>

    <script src="/traffic.js"></script>
</body>
</html>

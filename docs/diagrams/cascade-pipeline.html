  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);

    h1 { font-family: var(--font-serif); font-size: clamp(1.75rem, 2.6vw + 0.75rem, 2.5rem); font-weight: 400;
          letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 0.4rem; }
    .subtitle { color: var(--color-muted); font-size: 0.95rem; margin-bottom: 1.25rem; }
    .subtitle code { font-family: var(--font-mono); font-size: 0.85em; }
    .nav { margin-top: 1rem; font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 0.08em; color: var(--color-muted); }
    .nav a { color: #2e5aa8; text-decoration: none; margin-right: 1.25rem; }
    svg { width: 100%; min-width: 1280px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>

  <div class="frame">
    <p class="eyebrow">Detail · Stage 1 · Detection</p>
    <h1>Every frame: decode → NPU → boxes + vehicle log</h1>
    <p class="subtitle">From <code>DetectionVideoTrack.recv()</code>: what happens to each 1080p frame between the video file and the page.</p>

<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cascade-pipeline-title cascade-pipeline-desc">
<title id="cascade-pipeline-title">Per-frame detection pipeline</title>
<desc id="cascade-pipeline-desc">Each video frame is decoded on the CPU, letterboxed to 640x640, run through YOLO26n on the Hexagon NPU, filtered by confidence, NMS, vehicle class and entry zone, drawn and streamed to the page, while a tracker logs each vehicle once to the panel and keeps its best crop for Describe.</desc>
